<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatterHub - Login or Register</title>
    <meta name="description" content="Log in or register to ChatterHub, a social platform for connecting with friends and the world around you.">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="src/scss/index.css">
    <link rel="icon" href="/images/C Logo.png" type="image/png">

</head>
<body>
    <!-- Header / Navbar -->

    <main class="container auth-container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- Logo / Branding -->
                <div class="auth-header">
                    <img src="/images/C Logo.png" width="250" alt="ChatterHub logo" class="mb-3">
                    <h1>Welcome to ChatterHub</h1>
                </div>
                <!-- Tagline -->
                <p class="tagline">Connect with your friends and the world around you.</p>
                <!-- Card for Authentication -->
                <div class="card">
                    <div class="card-body">
                        <h2 class="h4 text-center mb-4">Login or Register</h2>
                        <!-- Authentication Form -->
                        <form action="/profile/index.html" method="GET" id="auth-form" class="needs-validation" novalidate>
                            <!-- Username -->
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                                <div class="invalid-feedback">
                                    Please enter a username.
                                </div>
                            </div>
                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required minlength="8">
                                <div class="invalid-feedback">
                                    Password must be at least 8 characters long.
                                </div>
                            </div>
                            <!-- Login/Register Button -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Login</button>
                                <button type="button" class="btn btn-outline-secondary">Register</button>
                            </div>
                        </form>
                    </div>
                </div>
                <!-- Footer Links -->
                <div class="footer-links">
                    <a href="#">Privacy Policy</a> | 
                    <a href="#">Terms of Service</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Form Validation Script -->
    <script>
        (function () {
            'use strict';
            var forms = document.querySelectorAll('.needs-validation');
            Array.prototype.slice.call(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        })();
    </script>
</body>
</html>
